<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { margin:0; font-family:Arial; text-align:center; background:black; color:white; }
    #reader { width:100%; position:relative; }
    #frame {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:200px; height:200px;
      border:4px solid white; border-radius:12px;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
      pointer-events:none;
    }
    #frame.sucesso { border:4px solid #00ff88; box-shadow:0 0 25px #00ff88; }
    #mensagem {
      position:fixed; top:40%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.8);
      padding:20px 30px; border-radius:10px;
      font-size:22px; display:none;
      z-index: 1000;
    }
    #status { padding: 10px; }
    #debug-panel {
      position: fixed;
      bottom: 50px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.9);
      color: #0f0;
      font-family: monospace;
      font-size: 10px;
      padding: 5px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      z-index: 1001;
      display: none;
      border: 1px solid #0f0;
      border-radius: 5px;
    }
    .debug-visible #debug-panel {
      display: block;
    }
    #toggle-debug {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 1002;
      background: #333;
      color: white;
      border: 1px solid #666;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      font-family: monospace;
    }
    #toggle-debug:hover {
      background: #555;
    }
  </style>
</head>
<body>

<h3 id="status">Iniciando câmera...</h3>
<div id="reader" style="display:none;"><div id="frame"></div></div>
<div id="mensagem">✔ Leitura confirmada</div>
<div id="debug-panel"></div>
<button id="toggle-debug">🐛 Mostrar Debug</button>

<script>
// Sistema de logs aprimorado
const LOGS = [];
let debugMode = false;

// Verificar se deve ativar debug via URL
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("debug") === "true" || urlParams.get("debug") === "1") {
  debugMode = true;
  document.body.classList.add('debug-visible');
  console.log('🔧 Debug mode ativado via parâmetro URL');
}

const _log = (msg, ...args) => {
  const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
  const logMsg = `[${timestamp}] ${msg}`;
  console.log(logMsg, ...args);
  LOGS.push({ type: 'log', msg: logMsg, args });
  updateDebugPanel();
};

const _err = (msg, ...args) => {
  const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
  const logMsg = `[${timestamp}] ❌ ERRO: ${msg}`;
  console.error(logMsg, ...args);
  LOGS.push({ type: 'error', msg: logMsg, args });
  updateDebugPanel();
};

const _warn = (msg, ...args) => {
  const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
  const logMsg = `[${timestamp}] ⚠️ ${msg}`;
  console.warn(logMsg, ...args);
  LOGS.push({ type: 'warn', msg: logMsg, args });
  updateDebugPanel();
};

function updateDebugPanel() {
  if (!debugMode) return;
  const panel = document.getElementById('debug-panel');
  if (!panel) return;
  
  const lastLogs = LOGS.slice(-20);
  panel.innerHTML = lastLogs.map(log => 
    `<div style="color: ${log.type === 'error' ? '#f00' : log.type === 'warn' ? '#ff0' : '#0f0'}; border-bottom: 1px solid #333; padding: 2px 0;">${log.msg}</div>`
  ).join('');
  
  panel.scrollTop = panel.scrollHeight;
}

// Botão para ativar/desativar debug
document.getElementById('toggle-debug').addEventListener('click', () => {
  debugMode = !debugMode;
  document.body.classList.toggle('debug-visible', debugMode);
  _log(`🐛 Debug mode ${debugMode ? 'ativado' : 'desativado'}`);
  if (debugMode) {
    document.getElementById('toggle-debug').textContent = '🐛 Ocultar Debug';
  } else {
    document.getElementById('toggle-debug').textContent = '🐛 Mostrar Debug';
  }
});

// Inicializar texto do botão
if (debugMode) {
  document.getElementById('toggle-debug').textContent = '🐛 Ocultar Debug';
}

// Captura erros globais não tratados
window.addEventListener('error', (e) => {
  _err('ERRO GLOBAL NÃO TRATADO:', e.message, '| arquivo:', e.filename, '| linha:', e.lineno);
  _err('Stack:', e.error?.stack);
});

window.addEventListener('unhandledrejection', (e) => {
  _err('PROMISE REJEITADA SEM CATCH:', e.reason);
  if (e.reason?.stack) _err('Stack:', e.reason.stack);
});

/* ── FASE 1: AMBIENTE ── */
_log('=== 🚀 INÍCIO DO SCANNER ===');
_log('UserAgent:', navigator.userAgent);
_log('URL completa:', location.href);
_log('Debug ativado por URL:', urlParams.get("debug"));

// ... (restante do código permanece igual) ...
</script>
</body>
</html>
