<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta charset="UTF-8">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }
    
    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 15px;
      font-size: 14px;
      background: rgba(0,0,0,0.8);
      z-index: 10;
      text-align: center;
    }
    
    #reader {
      width: 100%;
      height: 100vh;
      position: relative;
      background: #000;
    }
    
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    
    /* Moldura apenas com os cantos */
    #frame {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      pointer-events: none;
      z-index: 20;
    }
    
    /* Cantos da moldura */
    #frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border-top: 4px solid #fff;
      border-left: 4px solid #fff;
      transition: border-color 0.3s ease;
    }
    
    #frame::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      border-top: 4px solid #fff;
      border-right: 4px solid #fff;
      transition: border-color 0.3s ease;
    }
    
    #frame .corner-bottom-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border-bottom: 4px solid #fff;
      border-left: 4px solid #fff;
      transition: border-color 0.3s ease;
    }
    
    #frame .corner-bottom-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 40px;
      height: 40px;
      border-bottom: 4px solid #fff;
      border-right: 4px solid #fff;
      transition: border-color 0.3s ease;
    }
    
    #frame.sucesso::before,
    #frame.sucesso::after,
    #frame.sucesso .corner-bottom-left,
    #frame.sucesso .corner-bottom-right {
      border-color: #00ff88;
    }
    
    #mensagem {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      display: none;
      z-index: 30;
      border: 2px solid #00ff88;
      color: #00ff88;
      white-space: nowrap;
      animation: fadeOut 1s ease forwards;
    }
    
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: #888;
      z-index: 15;
    }
  </style>
</head>
<body>

<div id="status">📷 Iniciando câmera...</div>
<div id="reader"></div>
<div id="frame">
  <div class="corner-bottom-left"></div>
  <div class="corner-bottom-right"></div>
</div>
<div id="mensagem">✓ Leitura confirmada!</div>
<div class="loading" id="loading">Aguardando permissão...</div>

<script>
(function() {
  'use strict';
  
  let scanner = null;
  let leituraFeita = false;
  let token = null;
  let origemWebApp = '*';
  
  const params = new URLSearchParams(window.location.search);
  token = params.get('token');
  const paramOrigem = params.get('origem');
  origemWebApp = paramOrigem ? decodeURIComponent(paramOrigem) : '*';
  
  if (!token) {
    document.body.innerHTML = '<div style="padding: 20px; color: #ff4444;">❌ Token inválido. Feche esta janela e tente novamente.</div>';
    throw new Error('Token obrigatório');
  }
  
  if (!window.opener) {
    document.body.innerHTML = '<div style="padding: 20px; color: #ff4444;">❌ Esta janela deve ser aberta pelo sistema.</div>';
    throw new Error('window.opener é null');
  }
  
  async function iniciarScanner() {
    const statusDiv = document.getElementById('status');
    const loadingDiv = document.getElementById('loading');
    
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Seu navegador não suporta acesso à câmera');
      }
      
      statusDiv.innerHTML = '📷 Solicitando permissão...';
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      stream.getTracks().forEach(track => track.stop());
      
      statusDiv.innerHTML = '📷 Buscando câmeras...';
      
      await new Promise(resolve => setTimeout(resolve, 100));
      
      const cameras = await Html5Qrcode.getCameras();
      
      if (!cameras || cameras.length === 0) {
        throw new Error('Nenhuma câmera encontrada');
      }
      
      let cameraId = cameras[0].id;
      
      for (const cam of cameras) {
        const label = cam.label.toLowerCase();
        if (label.includes('environment') || label.includes('back') || label.includes('rear') || label.includes('traseira')) {
          cameraId = cam.id;
          break;
        }
      }
      
      if (loadingDiv) loadingDiv.style.display = 'none';
      
      scanner = new Html5Qrcode('reader');
      
      statusDiv.innerHTML = '📷 Iniciando câmera...';
      
      await scanner.start(
        cameraId,
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      );
      
      statusDiv.innerHTML = '📷 Aponte para o QR Code';
      
    } catch (err) {
      console.error('[SCANNER] Erro:', err);
      statusDiv.innerHTML = `❌ ${err.message}`;
      if (loadingDiv) loadingDiv.innerHTML = '❌ Erro: ' + err.message;
      setTimeout(() => window.close(), 3000);
    }
  }
  
  function onScanSuccess(qrCode) {
    if (leituraFeita) return;
    leituraFeita = true;
    
    const frame = document.getElementById('frame');
    const mensagem = document.getElementById('mensagem');
    const status = document.getElementById('status');
    
    frame.classList.add('sucesso');
    mensagem.style.display = 'block';
    status.style.display = 'none';
    
    const payload = {
      tipo: 'qr',
      codigo: qrCode,
      token: token,
      timestamp: new Date().toISOString()
    };
    
    if (scanner && scanner.isScanning) {
      scanner.stop().catch(e => console.warn('[SCANNER] Erro ao parar:', e));
    }
    
    setTimeout(() => {
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, origemWebApp);
        }
      } catch (e) {
        console.error('[SCANNER] Erro ao enviar:', e);
      }
      
      setTimeout(() => window.close(), 300);
    }, 500);
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(iniciarScanner, 100);
    });
  } else {
    setTimeout(iniciarScanner, 100);
  }
  
})();
</script>
</body>
</html>
