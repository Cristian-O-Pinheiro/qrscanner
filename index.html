<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
      background: #000;
      color: #fff;
    }

    #status {
      padding: 15px;
      font-size: 16px;
      background: rgba(0,0,0,0.7);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    #reader {
      width: 100%;
      height: 100vh;
      position: relative;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      pointer-events: none;
      z-index: 20;
    }

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 4px solid #fff;
    }

    .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
    .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
    .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
    .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }

    #frame.sucesso .corner {
      border-color: #00ff88;
    }

    #mensagem {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      display: none;
      z-index: 30;
      border: 2px solid #00ff88;
      color: #00ff88;
      animation: fadeOut 1s ease forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
  </style>
</head>

<body>

<div id="status">📷 Iniciando câmera...</div>

<div id="reader">
  <video id="video" playsinline></video>

  <div id="frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
</div>

<div id="mensagem">✓ Leitura confirmada!</div>

<!-- SCRIPT ÚNICO E CORRETO -->
<script type="module">
import QrScanner from "https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js";

(async function() {
  'use strict';

  let scanner = null;
  let leituraFeita = false;

  const video = document.getElementById('video');
  const status = document.getElementById('status');

  // TOKEN
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const origemWebApp = params.get('origem') ? decodeURIComponent(params.get('origem')) : '*';

  if (!token) {
    document.body.innerHTML = '<div style="padding:20px;color:#ff4444;">❌ Token inválido</div>';
    throw new Error('Token obrigatório');
  }

  try {

    // 🔥 CRIA SCANNER
    scanner = new QrScanner(
      video,
      result => onScanSuccess(result.data),
      {
        preferredCamera: 'environment',
        highlightScanRegion: false,
        highlightCodeOutline: false,
        returnDetailedScanResult: true
      }
    );

    await scanner.start();

    status.innerHTML = '📷 Aponte para o QR Code';

  } catch (err) {
    console.error('[SCANNER] Erro:', err);

    // Mensagem amigável
    if (err.message.includes('Permission')) {
      status.innerHTML = '❌ Permissão da câmera negada';
    } else {
      status.innerHTML = `❌ ${err.message}`;
    }

    setTimeout(() => window.close(), 3000);
  }

  function onScanSuccess(qrCode) {
    if (leituraFeita) return;
    leituraFeita = true;

    const frame = document.getElementById('frame');
    const mensagem = document.getElementById('mensagem');

    frame.classList.add('sucesso');
    mensagem.style.display = 'block';
    status.style.display = 'none';

    const payload = {
      tipo: 'qr',
      codigo: qrCode,
      token: token,
      timestamp: new Date().toISOString()
    };

    if (scanner) {
      scanner.stop();
    }

    setTimeout(() => {
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, origemWebApp);
        }
      } catch (e) {
        console.error('[SCANNER] erro envio', e);
      }

      setTimeout(() => window.close(), 300);
    }, 500);
  }

})();
</script>

</body>
</html>
