<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      text-align: center;
      background: #000;
      color: #fff;
    }

    #status {
      padding: 15px;
      font-size: 16px;
      background: rgba(0,0,0,0.7);
      margin: 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    #reader {
      width: 100%;
      height: 100vh;
      position: relative;
      background: #000;
    }

    /* NOVA MOLDURA (APENAS CANTOS) */
    #frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      pointer-events: none;
      z-index: 20;
    }

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #fff;
    }

    .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
    .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
    .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
    .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }

    /* EFEITO SUCESSO */
    #frame.sucesso .corner {
      border-color: #00ff88;
    }

    #mensagem {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      display: none;
      z-index: 30;
      border: 2px solid #00ff88;
      color: #00ff88;
      white-space: nowrap;
      animation: fadeOut 1s ease forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>

<div id="status">📷 Iniciando câmera...</div>
<div id="reader"></div>

<div id="frame">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
</div>

<div id="mensagem">✓ Leitura confirmada!</div>

<script>
(function() {
  'use strict';

  let scanner = null;
  let leituraFeita = false;
  let token = null;
  let origemWebApp = '*';

  window.addEventListener('error', (e) => {
    console.error('[SCANNER] Erro:', e.message);
  });

  // TOKEN
  const params = new URLSearchParams(window.location.search);
  token = params.get('token');
  const paramOrigem = params.get('origem');
  origemWebApp = paramOrigem ? decodeURIComponent(paramOrigem) : '*';

  if (!token) {
    document.body.innerHTML = '<div style="padding:20px;color:#ff4444;">❌ Token inválido</div>';
    throw new Error('Token obrigatório');
  }

  // INICIAR SCANNER
  async function iniciarScanner() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Navegador não suporta câmera');
      }

      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error('Nenhuma câmera encontrada');
      }

      let cameraId = cameras[0].id;

      for (const cam of cameras) {
        const label = cam.label.toLowerCase();
        if (label.includes('back') || label.includes('rear') ||
            label.includes('environment') || label.includes('traseira')) {
          cameraId = cam.id;
          break;
        }
      }

      scanner = new Html5Qrcode('reader');

      // 🔥 SEM QRBOX (câmera livre)
      await scanner.start(
        cameraId,
        { fps: 10 },
        onScanSuccess
      );

      document.getElementById('status').innerHTML = '📷 Aponte para o QR Code';

    } catch (err) {
      console.error('[SCANNER] Erro:', err);
      document.getElementById('status').innerHTML = `❌ ${err.message}`;
      setTimeout(() => window.close(), 3000);
    }
  }

  // SUCESSO
  function onScanSuccess(qrCode) {
    if (leituraFeita) return;
    leituraFeita = true;

    const frame = document.getElementById('frame');
    const mensagem = document.getElementById('mensagem');
    const status = document.getElementById('status');

    frame.classList.add('sucesso');
    mensagem.style.display = 'block';
    status.style.display = 'none';

    const payload = {
      tipo: 'qr',
      codigo: qrCode,
      token: token,
      timestamp: new Date().toISOString()
    };

    if (scanner && scanner.isScanning) {
      scanner.stop().catch(() => {});
    }

    setTimeout(() => {
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, origemWebApp);
        }
      } catch (e) {
        console.error('[SCANNER] erro envio', e);
      }

      setTimeout(() => window.close(), 300);
    }, 500);
  }

  iniciarScanner();

})();
</script>
</body>
</html>
