<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { margin:0; font-family:Arial; text-align:center; background:black; color:white; }
    #reader { width:100%; position:relative; }
    #frame {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:250px; height:250px;
      border:4px solid white; border-radius:12px;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
      pointer-events:none;
    }
    #frame.sucesso { border:4px solid #00ff88; box-shadow:0 0 25px #00ff88; }
    #mensagem {
      position:fixed; top:40%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.8);
      padding:20px 30px; border-radius:10px;
      font-size:22px; display:none;
    }
  </style>
</head>
<body>

<h3 id="status">Iniciando câmera...</h3>
<div id="reader" style="display:none;"><div id="frame"></div></div>
<div id="mensagem">✔ Leitura confirmada</div>

<script>
/* === SEGURANÇA BÁSICA DE CONTEXTO === */
if (!window.opener) {
  document.body.innerHTML = "<h3>Acesso inválido</h3>";
  throw new Error("Página deve ser aberta exclusivamente pelo SIGI.");
}

/* === REPASSE DE PARÂMETROS === */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const paramOrigem = params.get("origem");
const origemWebApp = paramOrigem ? decodeURIComponent(paramOrigem) : "*";

if (!token) {
  document.body.innerHTML = "<h3>Token de Sessão ausente</h3>";
  throw new Error("Token obrigatório.");
}

/* === SCANNER === */
const scanner = new Html5Qrcode("reader");
let leituraFeita = false;

function sucesso(qr) {
  if (leituraFeita) return;
  leituraFeita = true;

  document.getElementById("status").style.display = "none";
  document.getElementById("frame").classList.add("sucesso");
  document.getElementById("mensagem").style.display = "block";

  const enviar = () => {
    setTimeout(() => {
      // Repassa os dados para validação OFICIAL e SEGURA no Backend
      window.opener.postMessage({
        tipo: "qr",
        codigo: qr,
        token: token
      }, origemWebApp);

      setTimeout(() => window.close(), 300);
    }, 400);
  };

  scanner.stop().then(enviar).catch(enviar);
}

/* === INICIAR CÂMERA === */
async function iniciarCamera() {
  try {
    document.getElementById("status").innerText = "Escaneando...";
    document.getElementById("reader").style.display = "block";

    const cameras = await Html5Qrcode.getCameras();
    if (!cameras || cameras.length === 0) {
      document.getElementById("status").innerText = "Nenhuma câmera encontrada.";
      setTimeout(() => window.close(), 3000);
      return;
    }

    let cameraId = cameras[cameras.length - 1].id;
    for (const cam of cameras) {
      const label = cam.label.toLowerCase();
      if (label.includes("back") || label.includes("rear") ||
          label.includes("environment") || label.includes("traseira")) {
        cameraId = cam.id;
        break;
      }
    }

    await scanner.start(cameraId, { fps: 10, qrbox: 250 }, sucesso);

  } catch (err) {
    document.getElementById("status").innerText = "Erro ao acessar câmera: " + err.message;
    console.error(err);
    setTimeout(() => window.close(), 3000);
  }
}

// Inicia imediatamente!
iniciarCamera();

</script>
</body>
</html>
