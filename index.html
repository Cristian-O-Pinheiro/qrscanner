<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { margin:0; font-family:Arial; text-align:center; background:black; color:white; }
    #reader { width:100%; position:relative; }
    #frame {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:200px; height:200px;
      border:4px solid white; border-radius:12px;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
      pointer-events:none;
      transition: all 0.3s ease;
    }
    #frame.sucesso { 
      border:4px solid #00ff88; 
      box-shadow:0 0 25px #00ff88;
    }
    #mensagem {
      position:fixed; top:40%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.9);
      padding:20px 30px;
      border-radius:10px;
      font-size:22px;
      display:none;
      z-index: 1000;
      border: 2px solid #00ff88;
      color: #00ff88;
      font-weight: bold;
    }
    #status { padding: 10px; font-size: 14px; }
    .log-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.95);
      color: #0f0;
      font-family: monospace;
      font-size: 10px;
      max-height: 150px;
      overflow-y: auto;
      padding: 5px;
      text-align: left;
      z-index: 1001;
      border-top: 1px solid #0f0;
    }
    .log-entry {
      border-bottom: 1px solid #333;
      padding: 2px 5px;
      font-size: 10px;
    }
    .log-error { color: #f00; }
    .log-warn { color: #ff0; }
    .log-success { color: #0f0; }
  </style>
</head>
<body>

<h3 id="status">Iniciando câmera...</h3>
<div id="reader" style="display:none;"><div id="frame"></div></div>
<div id="mensagem">✓ QR Code lido com sucesso! ✓</div>
<div id="visualLogs" class="log-container"></div>

<script>
// Sistema de logs visual (além do console)
const visualLogs = [];
let leituraFeita = false;
let qrCodeLido = null;
let scanner = null;

function addVisualLog(msg, type = 'info') {
  const timestamp = new Date().toLocaleTimeString();
  const logEntry = { timestamp, msg, type };
  visualLogs.push(logEntry);
  
  // Manter apenas últimas 30 mensagens
  while (visualLogs.length > 30) visualLogs.shift();
  
  // Atualizar display visual
  const container = document.getElementById('visualLogs');
  if (container) {
    container.innerHTML = visualLogs.map(log => 
      `<div class="log-entry log-${log.type}">[${log.timestamp}] ${log.msg}</div>`
    ).join('');
    container.scrollTop = container.scrollHeight;
  }
  
  // Também log no console
  const consoleMethod = type === 'error' ? console.error : (type === 'warn' ? console.warn : console.log);
  consoleMethod(`[QR] ${msg}`);
}

// Captura erros globais
window.addEventListener('error', (e) => {
  addVisualLog(`ERRO GLOBAL: ${e.message} em ${e.filename}:${e.lineno}`, 'error');
  addVisualLog(`Stack: ${e.error?.stack?.substring(0, 200)}`, 'error');
});

window.addEventListener('unhandledrejection', (e) => {
  addVisualLog(`PROMISE REJEITADA: ${e.reason}`, 'error');
  if (e.reason?.stack) addVisualLog(`Stack: ${e.reason.stack.substring(0, 200)}`, 'error');
});

/* ── FASE 1: AMBIENTE ── */
addVisualLog('=== 🚀 INÍCIO DO SCANNER ===', 'success');
addVisualLog(`UserAgent: ${navigator.userAgent.substring(0, 80)}`, 'info');
addVisualLog(`URL: ${location.href}`, 'info');

/* ── FASE 2: PARÂMETROS ── */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const paramOrigem = params.get("origem");
const origemWebApp = paramOrigem ? decodeURIComponent(paramOrigem) : "*";

addVisualLog(`Token: ${token ? '✓ Presente' : '❌ AUSENTE'}`, token ? 'success' : 'error');
addVisualLog(`Origem: ${origemWebApp}`, 'info');

if (!token) {
  addVisualLog('❌ Token ausente na URL - FECHANDO', 'error');
  document.body.innerHTML = "<h3>Token de Sessão ausente</h3>";
  throw new Error("Token obrigatório.");
}

/* ── FASE 3: VERIFICAR POPUP ── */
addVisualLog(`window.opener existe? ${!!window.opener}`, !!window.opener ? 'success' : 'error');

if (!window.opener) {
  addVisualLog('❌ BLOQUEADO: window.opener é null', 'error');
  document.body.innerHTML = "<h3>Acesso inválido</h3>";
  throw new Error("Página deve ser aberta exclusivamente pelo SIGI.");
}

addVisualLog('✅ window.opener OK', 'success');

/* ── FASE 4: CRIAR SCANNER ── */
addVisualLog('Criando Html5Qrcode...', 'info');
try {
  scanner = new Html5Qrcode("reader");
  addVisualLog('✅ Scanner criado com sucesso', 'success');
} catch (e) {
  addVisualLog(`❌ Falha ao criar scanner: ${e.message}`, 'error');
  throw e;
}

/* ── FASE 5: FUNÇÃO DE SUCESSO COM LOGS DETALHADOS ── */
function sucesso(qr) {
  addVisualLog('=== 📸 CALLBACK SUCESSO INICIADO ===', 'success');
  addVisualLog(`leituraFeita atual: ${leituraFeita}`, 'info');
  addVisualLog(`QR Code lido (primeiros 50 chars): ${qr.substring(0, 50)}...`, 'info');
  
  // PASSO 1: Verificar se já foi lido
  addVisualLog('PASSO 1: Verificando leitura duplicada...', 'info');
  if (leituraFeita) {
    addVisualLog('⚠️ Leitura duplicada ignorada', 'warn');
    return;
  }
  addVisualLog('✅ Primeira leitura, continuando...', 'success');
  
  // PASSO 2: Marcar como lido
  addVisualLog('PASSO 2: Marcando leituraFeita = true', 'info');
  leituraFeita = true;
  qrCodeLido = qr;
  addVisualLog(`✅ leituraFeita = true, qrCodeLido armazenado`, 'success');
  
  // PASSO 3: Atualizar UI - Borda verde
  addVisualLog('PASSO 3: Atualizando UI - Borda verde', 'info');
  try {
    const frame = document.getElementById("frame");
    if (frame) {
      frame.classList.add("sucesso");
      addVisualLog('✅ Borda verde adicionada', 'success');
    } else {
      addVisualLog('⚠️ Elemento "frame" não encontrado', 'warn');
    }
  } catch (e) {
    addVisualLog(`❌ Erro ao adicionar borda: ${e.message}`, 'error');
  }
  
  // PASSO 4: Mostrar mensagem de sucesso
  addVisualLog('PASSO 4: Exibindo mensagem de sucesso', 'info');
  try {
    const mensagemDiv = document.getElementById("mensagem");
    if (mensagemDiv) {
      mensagemDiv.style.display = "block";
      addVisualLog('✅ Mensagem de sucesso exibida', 'success');
      
      // Esconder mensagem após 1 segundo
      setTimeout(() => {
        addVisualLog('Escondendo mensagem após 1 segundo...', 'info');
        mensagemDiv.style.display = "none";
      }, 1000);
    } else {
      addVisualLog('⚠️ Elemento "mensagem" não encontrado', 'warn');
    }
  } catch (e) {
    addVisualLog(`❌ Erro ao exibir mensagem: ${e.message}`, 'error');
  }
  
  // PASSO 5: Esconder status
  try {
    const statusDiv = document.getElementById("status");
    if (statusDiv) statusDiv.style.display = "none";
    addVisualLog('✅ Status escondido', 'success');
  } catch (e) {
    addVisualLog(`❌ Erro ao esconder status: ${e.message}`, 'error');
  }
  
  // PASSO 6: Preparar payload
  addVisualLog('PASSO 6: Preparando payload JSON', 'info');
  const payload = {
    tipo: "qr",
    codigo: qr,
    token: token,
    timestamp: new Date().toISOString(),
    urlCompleta: location.href
  };
  addVisualLog(`Payload preparado: ${JSON.stringify(payload).substring(0, 100)}...`, 'info');
  
  // PASSO 7: Função de envio
  const enviar = () => {
    addVisualLog('=== 📤 FUNÇÃO ENVIAR INICIADA ===', 'success');
    addVisualLog('PASSO 7.1: Verificando window.opener...', 'info');
    addVisualLog(`window.opener existe? ${!!window.opener}`, 'info');
    addVisualLog(`window.opener.closed? ${window.opener?.closed}`, 'info');
    
    try {
      if (window.opener && !window.opener.closed) {
        addVisualLog(`PASSO 7.2: Enviando postMessage para ${origemWebApp}`, 'info');
        window.opener.postMessage(payload, origemWebApp);
        addVisualLog('✅ postMessage enviado com sucesso!', 'success');
        addVisualLog(`Payload enviado: ${JSON.stringify(payload)}`, 'info');
      } else {
        addVisualLog('❌ window.opener indisponível ou fechado!', 'error');
      }
    } catch (e) {
      addVisualLog(`❌ Erro no postMessage: ${e.message}`, 'error');
      addVisualLog(`Stack: ${e.stack?.substring(0, 200)}`, 'error');
    }
    
    // PASSO 8: Fechar popup após envio
    addVisualLog('PASSO 8: Aguardando 500ms para fechar popup...', 'info');
    setTimeout(() => {
      addVisualLog('Chamando window.close()...', 'info');
      try {
        window.close();
        addVisualLog('✅ window.close() executado', 'success');
      } catch (e) {
        addVisualLog(`❌ Erro ao fechar janela: ${e.message}`, 'error');
        addVisualLog('Popup pode precisar ser fechado manualmente', 'warn');
      }
    }, 500);
  };
  
  // PASSO 9: Parar câmera
  addVisualLog('PASSO 9: Parando câmera...', 'info');
  if (scanner && scanner.isScanning) {
    addVisualLog('Scanner está ativo, chamando stop()...', 'info');
    scanner.stop()
      .then(() => {
        addVisualLog('✅ Câmera parada com sucesso!', 'success');
        addVisualLog('Chamando função de envio...', 'info');
        enviar();
      })
      .catch((e) => {
        addVisualLog(`⚠️ Erro ao parar câmera: ${e.message}`, 'warn');
        addVisualLog('Continuando com envio mesmo assim...', 'warn');
        enviar();
      });
  } else {
    addVisualLog('Scanner não está ativo, enviando diretamente...', 'warn');
    enviar();
  }
  
  addVisualLog('=== FIM DA FUNÇÃO SUCESSO ===', 'success');
}

/* ── FASE 6: INICIAR CÂMERA ── */
async function iniciarCamera() {
  addVisualLog('=== 📷 INICIANDO CÂMERA ===', 'success');
  
  try {
    // Verificar API de mídia
    addVisualLog(`navigator.mediaDevices: ${!!navigator.mediaDevices}`, 'info');
    if (!navigator.mediaDevices) {
      throw new Error('navigator.mediaDevices indisponível');
    }
    
    document.getElementById("status").innerText = "📷 Escaneando...";
    document.getElementById("reader").style.display = "block";
    addVisualLog('UI preparada para escaneamento', 'success');
    
    addVisualLog('Buscando câmeras disponíveis...', 'info');
    const cameras = await Html5Qrcode.getCameras();
    addVisualLog(`✅ Encontradas ${cameras.length} câmeras`, 'success');
    
    cameras.forEach((cam, i) => {
      addVisualLog(`  ${i+1}: ${cam.label || 'Sem label'}`, 'info');
    });
    
    if (!cameras || cameras.length === 0) {
      throw new Error('Nenhuma câmera encontrada');
    }
    
    // Selecionar câmera (priorizar traseira)
    let cameraId = cameras[0].id;
    for (const cam of cameras) {
      const label = cam.label.toLowerCase();
      if (label.includes('back') || label.includes('rear') || 
          label.includes('environment') || label.includes('traseira')) {
        cameraId = cam.id;
        addVisualLog(`✅ Câmera traseira selecionada: ${cam.label}`, 'success');
        break;
      }
    }
    
    addVisualLog(`Iniciando scanner com câmera ID: ${cameraId.substring(0, 30)}...`, 'info');
    addVisualLog('Configuração: fps=10, qrbox=200x200', 'info');
    
    await scanner.start(
      cameraId,
      { fps: 10, qrbox: { width: 200, height: 200 } },
      sucesso
    );
    addVisualLog('✅ Scanner iniciado com sucesso!', 'success');
    addVisualLog('📷 Aguardando leitura de QR Code...', 'success');
    
  } catch (err) {
    addVisualLog(`❌ ERRO AO INICIAR CÂMERA: ${err.message}`, 'error');
    addVisualLog(`Stack: ${err.stack?.substring(0, 200)}`, 'error');
    document.getElementById("status").innerText = `❌ Erro: ${err.message}`;
    
    addVisualLog('Fechando em 3 segundos...', 'warn');
    setTimeout(() => {
      try {
        window.close();
      } catch(e) {
        addVisualLog('Não foi possível fechar automaticamente', 'warn');
      }
    }, 3000);
  }
}

// Adicionar listener para mensagens de confirmação do backend
window.addEventListener('message', (event) => {
  addVisualLog(`📨 Mensagem recebida de ${event.origin}`, 'info');
  addVisualLog(`Dados: ${JSON.stringify(event.data).substring(0, 100)}`, 'info');
  
  if (event.data && event.data.tipo === 'confirmacao') {
    addVisualLog('✅ CONFIRMAÇÃO RECEBIDA DO BACKEND!', 'success');
    addVisualLog(`Conteúdo: ${JSON.stringify(event.data)}`, 'success');
  }
});

// Iniciar tudo
addVisualLog('Chamando iniciarCamera()...', 'info');
iniciarCamera();
</script>
</body>
</html>
