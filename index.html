<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { margin:0; font-family:Arial; text-align:center; background:black; color:white; }
    #reader { width:100%; position:relative; }
    #frame {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:200px; height:200px;
      border:4px solid white; border-radius:12px;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
      pointer-events:none;
    }
    #frame.sucesso { border:4px solid #00ff88; box-shadow:0 0 25px #00ff88; }
    #mensagem {
      position:fixed; top:40%; left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.8);
      padding:20px 30px; border-radius:10px;
      font-size:22px; display:none;
    }
    #status { padding: 10px; }
  </style>
</head>
<body>

<h3 id="status">Iniciando câmera...</h3>
<div id="reader" style="display:none;"><div id="frame"></div></div>
<div id="mensagem">✔ Leitura confirmada</div>

<script>
// Sistema de logs simplificado (só console)
const _log = (msg, ...args) => console.log(`[QR] ${msg}`, ...args);
const _err = (msg, ...args) => console.error(`[QR] ❌ ${msg}`, ...args);
const _warn = (msg, ...args) => console.warn(`[QR] ⚠️ ${msg}`, ...args);

// Captura erros globais
window.addEventListener('error', (e) => {
  _err('ERRO GLOBAL:', e.message, 'em', e.filename, 'linha', e.lineno);
  _err('Stack:', e.error?.stack);
});

window.addEventListener('unhandledrejection', (e) => {
  _err('PROMISE REJEITADA:', e.reason);
});

/* ── FASE 1: AMBIENTE ── */
_log('=== 🚀 INÍCIO DO SCANNER ===');
_log('UserAgent:', navigator.userAgent);
_log('URL completa:', location.href);
_log('Protocolo:', location.protocol);

/* ── FASE 2: PARÂMETROS ── */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const paramOrigem = params.get("origem");
const origemWebApp = paramOrigem ? decodeURIComponent(paramOrigem) : "*";

_log('Token:', token ?? '❌ AUSENTE');
_log('Origem:', origemWebApp);

if (!token) {
  _err('❌ Token ausente na URL');
  document.body.innerHTML = "<h3>Token de Sessão ausente</h3>";
  throw new Error("Token obrigatório.");
}

/* ── FASE 3: VERIFICAR POPUP ── */
_log('window.opener:', window.opener);
_log('window.opener existe?', !!window.opener);

if (!window.opener) {
  _err('❌ BLOQUEADO: window.opener é null. Página não foi aberta como popup.');
  document.body.innerHTML = "<h3>Acesso inválido - Página deve ser aberta exclusivamente pelo SIGI.</h3>";
  throw new Error("Página deve ser aberta exclusivamente pelo SIGI.");
}

_log('✅ window.opener OK');

/* ── FASE 4: CRIAR SCANNER ── */
_log('Criando Html5Qrcode...');
let scanner;
try {
  scanner = new Html5Qrcode("reader");
  _log('✅ Scanner criado');
} catch (e) {
  _err('❌ Falha ao criar scanner:', e);
  throw e;
}

let leituraFeita = false;
let qrCodeLido = null;

/* ── FASE 5: CALLBACK DE LEITURA ── */
function sucesso(qr) {
  _log('=== 📸 QR CODE LIDO ===');
  _log('Conteúdo:', qr);
  
  if (leituraFeita) {
    _warn('Leitura duplicada ignorada');
    return;
  }
  
  leituraFeita = true;
  qrCodeLido = qr;
  
  // UI
  document.getElementById("frame").classList.add("sucesso");
  document.getElementById("mensagem").style.display = "block";
  document.getElementById("status").style.display = "none";
  _log('✅ UI atualizada');
  
  const payload = {
    tipo: "qr",
    codigo: qr,
    token: token,
    timestamp: new Date().toISOString()
  };
  
  _log('Payload a enviar:', JSON.stringify(payload));
  
  const enviar = () => {
    _log('Enviando postMessage...');
    _log('window.opener existe?', !!window.opener);
    _log('window.opener.closed?', window.opener?.closed);
    
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, origemWebApp);
        _log('✅ postMessage enviado para:', origemWebApp);
      } else {
        _err('❌ window.opener indisponível ou fechado');
      }
    } catch (e) {
      _err('❌ Erro no postMessage:', e);
    }
    
    _log('Aguardando 500ms para fechar...');
    setTimeout(() => {
      _log('Chamando window.close()...');
      try {
        window.close();
        _log('✅ window.close() chamado');
      } catch (e) {
        _err('❌ Erro no window.close():', e);
      }
    }, 500);
  };
  
  _log('Parando câmera...');
  scanner.stop()
    .then(() => {
      _log('✅ Câmera parada, enviando dados...');
      enviar();
    })
    .catch((e) => {
      _err('⚠️ Erro ao parar câmera:', e);
      _log('Continuando mesmo assim...');
      enviar();
    });
}

/* ── FASE 6: INICIAR CÂMERA ── */
async function iniciarCamera() {
  _log('=== 📷 INICIANDO CÂMERA ===');
  
  try {
    // Verificar API de mídia
    _log('navigator.mediaDevices:', !!navigator.mediaDevices);
    if (!navigator.mediaDevices) {
      throw new Error('navigator.mediaDevices indisponível. Verifique HTTPS e permissões.');
    }
    
    document.getElementById("status").innerText = "📷 Escaneando...";
    document.getElementById("reader").style.display = "block";
    _log('UI preparada');
    
    _log('Buscando câmeras...');
    const cameras = await Html5Qrcode.getCameras();
    _log(`✅ Encontradas ${cameras.length} câmeras:`);
    cameras.forEach((cam, i) => {
      _log(`  ${i+1}: ${cam.label || 'Sem label'} (${cam.id})`);
    });
    
    if (!cameras || cameras.length === 0) {
      throw new Error('Nenhuma câmera encontrada');
    }
    
    // Selecionar câmera (priorizar traseira)
    let cameraId = cameras[0].id;
    for (const cam of cameras) {
      const label = cam.label.toLowerCase();
      if (label.includes('back') || label.includes('rear') || 
          label.includes('environment') || label.includes('traseira')) {
        cameraId = cam.id;
        _log(`✅ Câmera traseira selecionada: ${cam.label}`);
        break;
      }
    }
    
    _log(`Iniciando scanner com câmera: ${cameraId}`);
    await scanner.start(
      cameraId,
      { fps: 10, qrbox: { width: 200, height: 200 } },
      sucesso
    );
    _log('✅ Scanner iniciado, aguardando QR Code...');
    
  } catch (err) {
    _err('❌ ERRO AO INICIAR CÂMERA:', err.message);
    _err('Stack:', err.stack);
    document.getElementById("status").innerText = `❌ Erro: ${err.message}`;
    
    _log('Fechando em 3 segundos...');
    setTimeout(() => {
      try {
        window.close();
      } catch(e) {
        _err('Não foi possível fechar:', e);
      }
    }, 3000);
  }
}

// Iniciar tudo
_log('Chamando iniciarCamera()...');
iniciarCamera();
</script>
</body>
</html>
